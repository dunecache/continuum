name: Build UI Preview

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        type: string
      release_name:
        description: GitHub release title
        required: true
        type: string
      publish_release:
        description: Publish the APKs as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

# Lint is a separate workflow (lint.yml) so a lint fix never waits behind an APK build.
concurrency:
  group: build-ui-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Clone subreddit lists
        run: git clone --depth 1 https://github.com/cygnusx-1-org/subreddit-lists.git "$GITHUB_WORKSPACE/../subreddit-lists"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      # One-time setup, run these once in a shell (keytool ships with the JDK):
      #   keytool -genkeypair -v -keystore preview.jks -alias continuum-preview \
      #           -keyalg RSA -keysize 4096 -validity 10000
      #   base64 -w0 preview.jks | gh secret set PREVIEW_KEYSTORE_BASE64
      #   gh secret set PREVIEW_KEYSTORE_PASSWORD   # the -storepass value, or a fresh one
      #   gh secret set PREVIEW_KEY_ALIAS           # continuum-preview
      #   gh secret set PREVIEW_KEY_PASSWORD        # the -keypass value
      # Keep preview.jks out of the repository; losing it means previews stop upgrading each other.
      - name: Set up preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
          PREVIEW_KEY_ALIAS: ${{ secrets.PREVIEW_KEY_ALIAS }}
          PREVIEW_KEY_PASSWORD: ${{ secrets.PREVIEW_KEY_PASSWORD }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ] || [ -z "$PREVIEW_KEYSTORE_PASSWORD" ] \
             || [ -z "$PREVIEW_KEY_ALIAS" ] || [ -z "$PREVIEW_KEY_PASSWORD" ]; then
            echo "::warning::Preview signing secrets are not all set. APKs will be signed with this job's throwaway debug key, so the next preview will need an uninstall before it installs."
            exit 0
          fi
          echo "$PREVIEW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview.jks"
          cat > preview-keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/preview.jks
          storePassword=$PREVIEW_KEYSTORE_PASSWORD
          keyAlias=$PREVIEW_KEY_ALIAS
          keyPassword=$PREVIEW_KEY_PASSWORD
          EOF

      - name: Build
        run: ./gradlew :app:assembleDebug

      - name: Verify main shell layout
        run: ./gradlew :app:testDebugUnitTest --tests 'ml.docilealligator.infinityforreddit.layout.MainShellLayoutTest'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-shell-render
          path: app/build/reports/shell/*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: continuum-ui-preview-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # The APKs are also attached to the release, so this copy only exists to recover from a
          # failed publish. Keeping it for the default 90 days burned ~70 MB of the free plan's
          # 500 MB artifact storage per build, which is about seven builds.
          retention-days: 2

      - name: Publish GitHub prerelease
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK files were produced" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apks[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${apks[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "Installable UI overhaul preview. These APKs use the debug application ID and signing key so they can be tested alongside an installed release." \
              --prerelease
          fi
