name: Build UI Preview

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        type: string
      release_name:
        description: GitHub release title
        required: true
        type: string
      publish_release:
        description: Publish the APKs as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Clone subreddit lists
        run: git clone --depth 1 https://github.com/cygnusx-1-org/subreddit-lists.git "$GITHUB_WORKSPACE/../subreddit-lists"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: continuum-ui-preview-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK files were produced" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apks[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${apks[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "Installable UI overhaul preview. These APKs use the debug application ID and signing key so they can be tested alongside an installed release." \
              --prerelease
          fi
